version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: medvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medvision_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-medvision_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medvision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medvision-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medvision-backend
    env_file: ./backend/.env
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-medvision}:${POSTGRES_PASSWORD:-medvision_dev_password}@postgres:5432/${POSTGRES_DB:-medvision_db}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
      - model_storage:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medvision-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medvision-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - medvision-network
    command: npm run dev -- --host

volumes:
  postgres_data:
    driver: local
  backend_storage:
    driver: local
  model_storage:
    driver: local

networks:
  medvision-network:
    driver: bridge
